{% extends "base.html" %}

{% block title %}{{ page.title }} &middot; {{ config.title }}{% endblock title %}

{% block content %}
<article>
  <h1>{{ page.title }}</h1>
  <time datetime="{{ page.date }}">{{ page.date | date(format="%Y-%m-%d") }}</time>
  {{ page.content | safe }}
</article>
{% endblock content %}
