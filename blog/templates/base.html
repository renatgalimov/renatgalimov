<!DOCTYPE html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <link rel="stylesheet" href="{{ get_url(path='style.css') | safe }}">
  {% if config.generate_feeds %}
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path='atom.xml') | safe }}">
  {% endif %}
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ get_url(path='/') | safe }}">{{ config.title }}</a>
    <nav>
      <a href="{{ get_url(path='/') | safe }}">Home</a>
      <a href="{{ get_url(path='posts/') | safe }}">Posts</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock content %}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ config.title }}</p>
  </footer>
</body>
</html>
