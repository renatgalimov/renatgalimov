<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turning a generated skill into a map</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 720px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 560px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Turning a generated skill into a map</h1>

    <svg viewBox="0 0 720 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skill-loop-title skill-loop-desc">
      <title id="skill-loop-title">Turning a generated skill into a map</title>
      <desc id="skill-loop-desc">Flowchart of a skill-refinement loop: cut the detail an agent can derive, then test whether a small model gets through on its own — if not, write in the exact trap and retry; if it does, each reviewer finding is cut, softened or merged unless it defends a hard-won pitfall.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows drawn first, behind nodes -->
      <line x1="480" y1="88" x2="480" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="168" x2="480" y2="192" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="480" y1="196" x2="480" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="280" x2="280" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="336" x2="480" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="424" x2="280" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="480" x2="480" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Return rail: both failure paths rejoin and go back to the test -->
      <path d="M 80 280 L 48 280" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <path d="M 80 424 L 56 424 A 8 8 0 0 1 48 416 L 48 284" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <path d="M 48 276 L 48 200 A 8 8 0 0 1 56 192 L 480 192" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <circle cx="48" cy="280" r="4" fill="#2d3142"/>
      <circle cx="480" cy="192" r="4" fill="#2d3142"/>

      <!-- Arrow labels -->
      <rect x="308" y="260" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="269" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="488" y="346" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="355" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <rect x="308" y="404" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="413" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="488" y="490" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="499" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <!-- Start oval -->
      <rect x="380" y="40" width="200" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="480" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Generated skill</text>
      <text x="480" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">raw inventory</text>

      <!-- Step: cut derivable detail -->
      <rect x="380" y="120" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="120" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cut what it can derive</text>

      <!-- Decision 1 (focal): the small-model test -->
      <polygon points="480,224 600,280 480,336 360,280" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="480" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Does a small model</text>
      <text x="480" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">get through?</text>

      <!-- Step: write the trap -->
      <rect x="80" y="256" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="256" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Write in the trap</text>
      <text x="180" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the exact one it hit</text>

      <!-- Decision 2: the reviewer's finding -->
      <polygon points="480,368 600,424 480,480 360,424" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reviewer finding</text>
      <text x="480" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">defends a pitfall?</text>

      <!-- Step: cut, soften, merge -->
      <rect x="80" y="400" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="400" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cut, soften, or merge</text>
      <text x="180" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deletion comes first</text>

      <!-- End oval -->
      <rect x="380" y="512" width="200" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="480" y="540" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Leave it in. Ship.</text>
      <text x="480" y="556" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">a map, not an inventory</text>

      <!-- Legend -->
      <line x1="48" y1="592" x2="672" y2="592" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="48" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="48" y="628" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="80" y="638" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Start / end</text>

      <rect x="216" y="628" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="248" y="638" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Step</text>

      <polygon points="372,634 384,628 396,634 384,640" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="408" y="638" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Decision</text>

      <line x1="552" y1="634" x2="580" y2="634" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="592" y="638" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Back to the test</text>
    </svg>
  </div>
</body>
</html>
