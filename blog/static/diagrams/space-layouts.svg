  <text x="40" y="282" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="start">Each layout: 3 × 7 + 7 × 6 = 63 bits. Six layouts add log₂ 6 = 2.58 bits.</text>
  <text x="40" y="300" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="start">The decoder sees where the spaces are, so the layout itself is data.</text>
