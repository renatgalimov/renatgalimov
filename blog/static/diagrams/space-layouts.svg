<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 364" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="spaces-title spaces-desc">
  <title id="spaces-title">The bits are in the spaces</title>
  <desc id="spaces-desc">Three words built from tokens. A fixed layout of 3 + 4 + 4 tokens needs 11 tokens for 64 bits. With free word lengths, ten tokens can be split into three words in six ways (4+4+2, 4+2+4, 2+4+4, 4+3+3, 3+4+3, 3+3+4); each layout holds 63 bits and the choice of layout adds 2.58 bits, 65.6 in total.</desc>
